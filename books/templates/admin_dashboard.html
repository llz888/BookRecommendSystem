<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - 智能图书推荐系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #2c3e50;
            color: #fff;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .sidebar .nav-link {
            color: #abb1b7;
            padding: 15px 20px;
            transition: all 0.3s;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: #1abc9c;
            color: #fff;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 240px;
            padding: 25px;
        }

        #mainFrame {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            margin-top: 10px;
            width: 100%;
            height: 85vh;
            border: none;
        }

        .card-stat {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
        }

        .card-stat:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">图书馆管理后台</div>
    <div class="nav flex-column mt-3">
        <a class="nav-link active" href="javascript:void(0);" id="btn-dashboard">
            <i class="bi bi-speedometer2 me-2"></i> 数据概览看板
        </a>
        <a class="nav-link" href="{% url 'custom_admin_books' %}" target="mainFrame" id="btn-books">
            <i class="bi bi-book me-2"></i> 图书资源管理
        </a>
        <a class="nav-link" href="{% url 'custom_admin_user_list' %}" target="mainFrame" id="btn-users">
            <i class="bi bi-people me-2"></i> 读者审核中心
        </a>
        <a class="nav-link" href="{% url 'custom_admin_rating_list' %}" target="mainFrame" id="btn-ratings">
            <i class="bi bi-chat-left-text me-2"></i> 书评言论管理
        </a>
        <hr class="mx-3" style="color: #abb1b7;">
        
        <form action="{% url 'logout' %}" method="post" id="logout-form" style="display: none;">
            {% csrf_token %}
        </form>
        <a class="nav-link text-danger" href="javascript:void(0);" onclick="document.getElementById('logout-form').submit();">
            <i class="bi bi-box-arrow-right me-2"></i> 退出系统登录
        </a>
    </div>
</div>

<div class="main-content">
    <div id="dashboard-view">
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message|safe }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="p-3 bg-white mb-4 shadow-sm rounded d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold text-dark">全站运营数据分析看板</h4>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted small">身份：系统管理员</span>
                <span class="badge bg-success">在线</span>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card card-stat bg-primary text-white p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1 text-white-50">注册用户总数</h6>
                            <h2 class="fw-bold mb-0">{{ total_users|default:"0" }}</h2>
                        </div>
                        <i class="bi bi-people-fill stat-icon"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-stat bg-success text-white p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1 text-white-50">馆藏图书总量</h6>
                            <h2 class="fw-bold mb-0">{{ total_books|default:"0" }}</h2>
                        </div>
                        <i class="bi bi-journal-bookmark-fill stat-icon"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-stat bg-white p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                <h5 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-graph-up me-2 text-primary"></i>近 7 日图书借阅/阅读趋势
                </h5>
            </div>
            <div id="chart" style="height: 350px; width: 100%;"></div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card card-stat bg-white p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2 text-dark">
                        <i class="bi bi-pie-chart-fill me-2 text-warning"></i>图书分类占比分布
                    </h5>
                    <div id="pieChart" style="height: 350px; width: 100%;"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-stat bg-white p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2 text-dark">
                        <i class="bi bi-bar-chart-fill me-2 text-info"></i>热门图书互动排行
                    </h5>
                    <div id="barChart" style="height: 350px; width: 100%;"></div>
                </div>
            </div>
        </div>

    </div>

    <iframe name="mainFrame" id="mainFrame" src="" style="display: none;"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>

<script>
    // ================== 1. 独立并优先加载菜单切换逻辑 ==================
    // 逻辑隔离保障：这样即使图表数据出错，也绝不会导致左侧菜单点击失效
    document.addEventListener('DOMContentLoaded', function() {
        const dashboardView = document.getElementById('dashboard-view');
        const iframe = document.getElementById('mainFrame');
        const navLinks = document.querySelectorAll('.sidebar .nav-link');

        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                // 如果点击的是退出按钮，则不阻止默认提交行为
                if (this.classList.contains('text-danger')) return;

                if (this.id === 'btn-dashboard') {
                    e.preventDefault();
                    dashboardView.style.display = 'block';
                    iframe.style.display = 'none';
                    // 切换回主视图时触发 resize，防止 ECharts 图表宽度塌陷变形
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
                } else if (this.target === 'mainFrame') {
                    dashboardView.style.display = 'none';
                    iframe.style.display = 'block';
                }

                // 侧边栏高亮状态切换
                navLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });
</script>

<script>
    // ================== 2. 安全地初始化 ECharts ==================
    // 采用 try-catch 捕获异常，并且加入后端数据兜底机制 || []
    document.addEventListener('DOMContentLoaded', function() {
        try {
            // 如果 echarts 未加载成功，直接抛出异常，不会阻断其他核心代码
            if (typeof echarts === 'undefined') {
                console.error("ECharts 库未加载成功，请检查网络或 CDN");
                return;
            }

            // --- 折线图初始化 ---
            var chartDom = document.getElementById('chart');
            var myChart = echarts.init(chartDom);
            var chartLabels = {{ chart_labels|safe|default:"null" }} || ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            var chartValues = {{ chart_values|safe|default:"null" }} || [0, 0, 0, 0, 0, 0, 0];

            myChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, formatter: '{b} <br/>阅读量: <b>{c}</b> 次' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: chartLabels, axisLabel: { color: '#666' } },
                yAxis: { type: 'value', name: '阅读次数', axisLabel: { color: '#666' } },
                series: [{
                    name: '阅读量',
                    data: chartValues,
                    type: 'line',
                    smooth: true,
                    color: '#1abc9c',
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(26, 188, 156, 0.4)' },
                            { offset: 1, color: 'rgba(26, 188, 156, 0.1)' }
                        ])
                    },
                    lineStyle: { width: 4 }
                }]
            });

            // --- 饼图初始化 ---
            var pieDom = document.getElementById('pieChart');
            var pieChart = echarts.init(pieDom);
            var pieData = {{ pie_data|safe|default:"null" }} || [];
            
            pieChart.setOption({
                tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c}本 ({d}%)' },
                legend: { top: 'bottom' },
                series: [{
                    name: '图书分类',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                    label: { show: false, position: 'center' },
                    emphasis: { label: { show: true, fontSize: '18', fontWeight: 'bold' } },
                    labelLine: { show: false },
                    data: pieData
                }]
            });

            // --- 柱状图初始化 ---
            var barDom = document.getElementById('barChart');
            var barChart = echarts.init(barDom);
            var barLabels = {{ bar_labels|safe|default:"null" }} || [];
            var barValues = {{ bar_values|safe|default:"null" }} || [];
            
            // 安全解构数组并进行反转，避免重复反转原数组
            var bLabels = [...barLabels].reverse();
            var bValues = [...barValues].reverse();
            
            barChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '4%', bottom: '8%', containLabel: true },
                xAxis: { type: 'value', name: '互动量(次)' },
                yAxis: { type: 'category', data: bLabels, axisLabel: { interval: 0, width: 80, overflow: 'truncate' } },
                series: [{
                    name: '互动量',
                    type: 'bar',
                    data: bValues,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [
                            { offset: 0, color: '#3498db' },
                            { offset: 1, color: '#2980b9' }
                        ]),
                        borderRadius: [0, 5, 5, 0]
                    }
                }]
            });

            // 监听窗口大小改变，使图表自适应
            window.addEventListener('resize', function() {
                myChart.resize();
                pieChart.resize();
                barChart.resize();
            });

        } catch (error) {
            console.error("图表渲染出错 (可能由于后台数据为空): ", error);
        }
    });
</script>
</body>
</html>
