<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - 智能图书推荐系统</title>
    <link href="https://cdn.staticfile.org/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        /* 全屏渐变背景 */
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        /* 登录卡片样式 */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        /* 顶部 Logo 或 图标容器 */
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }
        
        /* 输入框容器样式，支持前置图标 */
        .input-group-text {
            background-color: transparent;
            border-right: none;
            color: #6c757d;
        }
        
        .form-control {
            border-left: none;
            padding-left: 0;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        
        /* 整个输入框组获取焦点时的外发光效果 */
        .input-group:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
            border-radius: 0.25rem;
        }
        
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #4f46e5;
        }
        
        /* 登录按钮样式 */
        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(79, 70, 229, 0.4);
        }
        
        /* 角色切换按钮组样式 */
        .role-switch .btn {
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-icon">
        <i class="bi bi-book-half"></i>
    </div>
    <h3 class="text-center fw-bold mb-1 text-dark">欢迎登录</h3>
    <p class="text-center text-muted mb-4 small">智能图书推荐与阅读分析系统</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm py-2"
                 role="alert" style="font-size: 0.9rem;">
                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="d-flex justify-content-center mb-4">
            <div class="btn-group role-switch shadow-sm" role="group">
                <input type="radio" class="btn-check" name="identity" id="readerRadio" value="reader" autocomplete="off"
                       checked>
                <label class="btn btn-outline-primary" for="readerRadio"><i
                        class="bi bi-person me-1"></i>读者登录</label>

                <input type="radio" class="btn-check" name="identity" id="adminRadio" value="admin" autocomplete="off">
                <label class="btn btn-outline-primary" for="adminRadio"><i class="bi bi-shield-lock me-1"></i>管理员登录</label>
            </div>
        </div>

        <div class="mb-4">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus
                       autocomplete="username">
            </div>
        </div>

        <div class="mb-4">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required
                       autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-login mt-2">
            立即登录 <i class="bi bi-arrow-right-circle ms-1"></i>
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">还没有账号？</span>
        <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-primary small">立即注册</a>
        <span class="text-muted mx-2">|</span>
        <a href="{% url 'home' %}" class="text-decoration-none text-secondary small"><i class="bi bi-house me-1"></i>返回首页</a>
    </div>
</div>

<script src="https://cdn.staticfile.org/twitter-bootstrap/5.1.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
