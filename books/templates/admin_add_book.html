<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title>新增图书</title>
    <link href="https://cdn.staticfile.org/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
        }
        
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>
<body>

<div class="form-container shadow-sm">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'custom_admin_books' %}" class="btn btn-light rounded-circle me-3"><i
                class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0">手动新增图书</h4>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label fw-bold small text-muted">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
        </div>
        
        <div class="mt-5 border-top pt-4 text-end">
            <a href="{% url 'custom_admin_books' %}" class="btn btn-light px-4 me-2">取消</a>
            <button type="submit" class="btn btn-primary px-5 shadow-sm">保存入库</button>
        </div>
    </form>
</div>

</body>
</html>
